spring.application.name=campushub
server.port=8080
  
  # MySQL (sobrescreva via variáveis de ambiente, se quiser)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campushub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
  
  # Jackson
spring.jackson.default-property-inclusion=non_null